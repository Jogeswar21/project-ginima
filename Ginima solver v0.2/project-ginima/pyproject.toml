[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ginima"
version = "0.2.0"
description = "Exact, verifiable JEE mathematics solver foundation"
requires-python = ">=3.10"
dependencies = ["sympy==1.14.0"]

[project.scripts]
ginima = "ginima.cli:main"

[tool.setuptools.packages.find]
include = ["ginima*"]
